<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hangly • Hanging Charms</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",
  "Segoe UI",Arial,sans-serif;
  background:#f4f1ea;
  color:#171717;
}

button{
  font:inherit;
}

.app{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 25%,
      rgba(255,255,255,.95),
      rgba(246,243,237,.96) 48%,
      rgba(232,228,220,1) 100%
    );
}

/* ================= TOP BAR ================= */

.topbar{
  position:absolute;
  left:0;
  right:0;
  top:0;
  height:64px;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:rgba(250,249,246,.72);
  backdrop-filter:blur(22px);
  -webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid rgba(0,0,0,.06);
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  user-select:none;
}

.brand-mark{
  width:30px;
  height:30px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(145deg,#fff,#e9e5dc);
  box-shadow:
    0 5px 15px rgba(0,0,0,.09),
    inset 0 1px 0 rgba(255,255,255,.95);
  font-size:17px;
}

.brand-text{
  font-size:16px;
  font-weight:700;
  letter-spacing:-.25px;
}

.brand-sub{
  color:#85827c;
  font-size:12px;
  font-weight:500;
}

/* ================= MENU ================= */

.menu-wrap{
  position:relative;
}

.menu-btn{
  height:40px;
  padding:0 14px;
  border:1px solid rgba(0,0,0,.08);
  border-radius:13px;
  background:rgba(255,255,255,.78);
  box-shadow:
    0 5px 15px rgba(0,0,0,.07),
    inset 0 1px 0 rgba(255,255,255,.9);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:7px;
  color:#202020;
  font-size:13px;
  font-weight:650;
}

.menu-btn:active{
  transform:scale(.96);
}

.menu-arrow{
  font-size:10px;
  opacity:.55;
}

.menu{
  display:none;
  position:absolute;
  right:0;
  top:47px;
  width:235px;
  padding:8px;
  border-radius:17px;
  background:rgba(250,250,250,.94);
  backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px);
  border:1px solid rgba(0,0,0,.08);
  box-shadow:
    0 18px 50px rgba(0,0,0,.16),
    0 2px 8px rgba(0,0,0,.06);
  z-index:50;
}

.menu.show{
  display:block;
}

.menu-title{
  padding:7px 10px 8px;
  font-size:10px;
  font-weight:750;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:#99958e;
}

.menu-item{
  width:100%;
  height:44px;
  border:0;
  border-radius:11px;
  background:transparent;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 10px;
  cursor:pointer;
  text-align:left;
  color:#252525;
  font-size:13px;
  font-weight:600;
}

.menu-item:hover,
.menu-item.active{
  background:rgba(0,0,0,.06);
}

.menu-icon{
  width:30px;
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:9px;
  background:rgba(0,0,0,.045);
  font-size:17px;
}

/* ================= STAGE ================= */

.stage{
  position:absolute;
  left:0;
  right:0;
  top:64px;
  bottom:126px;
  overflow:hidden;
}

canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:grab;
}

canvas.dragging{
  cursor:grabbing;
}

/* ================= CONTROLS ================= */

.controls{
  position:absolute;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  width:min(760px,calc(100% - 28px));
  padding:13px 15px;
  display:flex;
  align-items:center;
  gap:13px;
  background:rgba(250,249,246,.84);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(0,0,0,.075);
  border-radius:20px;
  box-shadow:
    0 14px 38px rgba(0,0,0,.09),
    inset 0 1px 0 rgba(255,255,255,.95);
  z-index:15;
}

.control{
  min-width:0;
  flex:1;
}

.control-label{
  display:flex;
  justify-content:space-between;
  margin-bottom:5px;
  font-size:10px;
  font-weight:700;
  color:#89857e;
}

.control-value{
  color:#34312d;
  font-variant-numeric:tabular-nums;
}

input[type="range"]{
  width:100%;
  height:18px;
  margin:0;
  appearance:none;
  -webkit-appearance:none;
  background:transparent;
  cursor:pointer;
}

input[type="range"]::-webkit-slider-runnable-track{
  height:4px;
  border-radius:99px;
  background:#d7d3cc;
}

input[type="range"]::-webkit-slider-thumb{
  appearance:none;
  -webkit-appearance:none;
  width:15px;
  height:15px;
  margin-top:-5.5px;
  border-radius:50%;
  background:#fff;
  border:1px solid rgba(0,0,0,.12);
  box-shadow:0 2px 7px rgba(0,0,0,.18);
}

.reset-btn{
  flex:0 0 auto;
  height:37px;
  padding:0 13px;
  border-radius:11px;
  border:1px solid rgba(0,0,0,.08);
  background:rgba(255,255,255,.8);
  color:#33302c;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}

/* ================= MOBILE ================= */

@media(max-width:650px){

  .topbar{
    height:58px;
    padding:0 13px;
  }

  .brand-sub{
    display:none;
  }

  .stage{
    top:58px;
    bottom:164px;
  }

  .controls{
    bottom:10px;
    width:calc(100% - 18px);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 12px;
    padding:12px;
    border-radius:17px;
  }

  .reset-btn{
    width:100%;
  }
}
</style>

<body>

<div class="app">

<header class="topbar">

    <div class="brand-mark">🪢</div>
    <div class="brand-text">Hangly</div>

  </div>

  <div class="menu-wrap">

    <button class="menu-btn" id="menuBtn">
      <span id="currentCharmIcon">🪬</span>
      <span id="currentCharmName">Evil Eye</span>
      <span class="menu-arrow">▾</span>
    </button>

    <div class="menu" id="menu">

      <div class="menu-title">
        Choose a charm
      </div>

      <button class="menu-item active" data-charm="evil">
        <span class="menu-icon">🪬</span>
        Evil Eye
      </button>

      <button class="menu-item" data-charm="lemon">
        <span class="menu-icon">🍋</span>
        Lemon + Chilli
      </button>

      <button class="menu-item" data-charm="lucky">
        <span class="menu-icon">☘️</span>
        Lucky Charm
      </button>

      <button class="menu-item" data-charm="hamsa">
        <span class="menu-icon">🪬</span>
        Hamsa
      </button>

    </div>

  </div>

</header>

<main class="stage">
  <canvas id="canvas"></canvas>
</main>

<section class="controls">

  <div class="control">
    <div class="control-label">
      <span>X Position</span>
      <span id="xValue">0</span>
    </div>
    <input id="xRange"
           type="range"
           min="-300"
           max="300"
           value="0">
  </div>

  <div class="control">
    <div class="control-label">
      <span>Y Position</span>
      <span id="yValue">0</span>
    </div>
    <input id="yRange"
           type="range"
           min="-80"
           max="280"
           value="0">
  </div>

  <div class="control">
    <div class="control-label">
      <span>Size</span>
      <span id="sizeValue">100%</span>
    </div>
    <input id="sizeRange"
           type="range"
           min="55"
           max="150"
           value="100">
  </div>

  <div class="control">
    <div class="control-label">
      <span>String Length</span>
      <span id="lengthValue">150</span>
    </div>
    <input id="lengthRange"
           type="range"
           min="60"
           max="330"
           value="150">
  </div>

  <button class="reset-btn" id="resetBtn">
    Reset
  </button>

</section>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resizeCanvas(){

  const rect = canvas.getBoundingClientRect();

  const dpr =
    Math.min(window.devicePixelRatio || 1,2);

  W = rect.width;
  H = rect.height;

  canvas.width =
    Math.round(W*dpr);

  canvas.height =
    Math.round(H*dpr);

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

window.addEventListener(
  "resize",
  resizeCanvas
);

resizeCanvas();


/* =====================================================
   UI
===================================================== */

const menuBtn =
  document.getElementById("menuBtn");

const menu =
  document.getElementById("menu");

const currentCharmIcon =
  document.getElementById("currentCharmIcon");

const currentCharmName =
  document.getElementById("currentCharmName");

const xRange =
  document.getElementById("xRange");

const yRange =
  document.getElementById("yRange");

const sizeRange =
  document.getElementById("sizeRange");

const lengthRange =
  document.getElementById("lengthRange");

const xValue =
  document.getElementById("xValue");

const yValue =
  document.getElementById("yValue");

const sizeValue =
  document.getElementById("sizeValue");

const lengthValue =
  document.getElementById("lengthValue");

const resetBtn =
  document.getElementById("resetBtn");


/* =====================================================
   STATE
===================================================== */

const state = {

  charm:"evil",

  x:0,

  y:0,

  size:1,

  restLength:150,

  dragging:false,

  pointerId:null,

  pointerX:0,

  pointerY:0,

  lastPointerX:0,

  lastPointerY:0,

  pointerVX:0,

  pointerVY:0,

  positionLockUntil:0
};


/* =====================================================
   PHYSICS
===================================================== */

const physics = {

  x:0,

  y:150,

  vx:0,

  vy:0,

  angle:0,

  angularVelocity:0,

  gravity:.34,

  damping:.992,

  angularDamping:.985,

  spring:.035,

  targetSpring:.09,

  maxStretch:110
};


/* =====================================================
   MENU
===================================================== */

menuBtn.addEventListener(
  "click",
  e=>{
    e.stopPropagation();
    menu.classList.toggle("show");
  }
);

document.addEventListener(
  "click",
  ()=>{
    menu.classList.remove("show");
  }
);


/* =====================================================
   CHARM SELECTION
===================================================== */

document
.querySelectorAll(".menu-item")
.forEach(item=>{

  item.addEventListener(
    "click",
    e=>{

      e.stopPropagation();

      state.charm =
        item.dataset.charm;

      document
      .querySelectorAll(".menu-item")
      .forEach(other=>{
        other.classList.remove("active");
      });

      item.classList.add("active");

      const names = {

        evil:"Evil Eye",

        lemon:"Lemon + Chilli",

        lucky:"Lucky Charm",

        hamsa:"Hamsa"

      };

      const icons = {

        evil:"🪬",

        lemon:"🍋",

        lucky:"☘️",

        hamsa:"🪬"

      };

      currentCharmName.textContent =
        names[state.charm];

      currentCharmIcon.textContent =
        icons[state.charm];

      menu.classList.remove("show");

      resetPhysics();

    }
  );

});


/* =====================================================
   CONTROLS
===================================================== */

function updateControls(){

  xValue.textContent =
    Math.round(state.x);

  yValue.textContent =
    Math.round(state.y);

  sizeValue.textContent =
    Math.round(state.size*100)+"%";

  lengthValue.textContent =
    Math.round(state.restLength);
}


/*
   IMPORTANT FIX:

   X/Y controls change BOTH:
   1. current physics position
   2. target position

   This prevents gravity/spring from immediately
   cancelling the slider movement.
*/

function lockPosition(){

  state.positionLockUntil =
    performance.now()+180;
}


xRange.addEventListener(
  "input",
  ()=>{

    state.x =
      Number(xRange.value);

    physics.x =
      state.x;

    physics.vx = 0;
    physics.vy = 0;

    lockPosition();

    updateControls();

  }
);


yRange.addEventListener(
  "input",
  ()=>{

    state.y =
      Number(yRange.value);

    physics.y =
      state.restLength + state.y;

    physics.vx = 0;
    physics.vy = 0;

    lockPosition();

    updateControls();

  }
);


sizeRange.addEventListener(
  "input",
  ()=>{

    state.size =
      Number(sizeRange.value)/100;

    updateControls();

  }
);


lengthRange.addEventListener(
  "input",
  ()=>{

    state.restLength =
      Number(lengthRange.value);

    physics.y =
      state.restLength + state.y;

    physics.vx = 0;
    physics.vy = 0;

    lockPosition();

    updateControls();

  }
);


resetBtn.addEventListener(
  "click",
  resetPhysics
);


/* =====================================================
   RESET
===================================================== */

function resetPhysics(){

  state.x = 0;

  state.y = 0;

  state.size =
    Number(sizeRange.value)/100;

  physics.x = 0;

  physics.y =
    state.restLength;

  physics.vx = 0;

  physics.vy = 0;

  physics.angle = 0;

  physics.angularVelocity = 0;

  xRange.value = 0;

  yRange.value = 0;

  lockPosition();

  updateControls();
}


/* =====================================================
   POINTER
===================================================== */

function getPointerPosition(e){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:e.clientX-rect.left,

    y:e.clientY-rect.top

  };
}


function isInsideCharm(px,py){

  const cx =
    W/2 + physics.x;

  const cy =
    30 + physics.y;

  const radius =
    78*state.size;

  const dx =
    px-cx;

  const dy =
    py-cy;

  return (
    dx*dx+
    dy*dy
  ) <= radius*radius;
}


/* =====================================================
   DRAG START
===================================================== */

canvas.addEventListener(
  "pointerdown",
  e=>{

    const p =
      getPointerPosition(e);

    if(!isInsideCharm(p.x,p.y)){
      return;
    }

    state.dragging = true;

    state.pointerId =
      e.pointerId;

    state.pointerX = p.x;
    state.pointerY = p.y;

    state.lastPointerX = p.x;
    state.lastPointerY = p.y;

    state.pointerVX = 0;
    state.pointerVY = 0;

    canvas.classList.add("dragging");

    canvas.setPointerCapture(
      e.pointerId
    );

  }
);


/* =====================================================
   DRAG MOVE
===================================================== */

canvas.addEventListener(
  "pointermove",
  e=>{

    if(
      !state.dragging ||
      e.pointerId !== state.pointerId
    ){
      return;
    }

    const p =
      getPointerPosition(e);

    const dx =
      p.x-state.lastPointerX;

    const dy =
      p.y-state.lastPointerY;

    state.pointerVX = dx;
    state.pointerVY = dy;

    state.pointerX = p.x;
    state.pointerY = p.y;

    state.lastPointerX = p.x;
    state.lastPointerY = p.y;

    physics.x =
      p.x-W/2;

    physics.y =
      Math.max(
        35,
        p.y-30
      );

    physics.vx = dx;
    physics.vy = dy;

    physics.angularVelocity =
      dx*.012;

  }
);


/* =====================================================
   RELEASE
===================================================== */

function releasePointer(e){

  if(
    !state.dragging ||
    e.pointerId !== state.pointerId
  ){
    return;
  }

  state.dragging = false;

  physics.vx =
    state.pointerVX*1.35;

  physics.vy =
    state.pointerVY*1.35;

  physics.angularVelocity =
    state.pointerVX*.014;

  canvas.classList.remove("dragging");

}


canvas.addEventListener(
  "pointerup",
  releasePointer
);

canvas.addEventListener(
  "pointercancel",
  releasePointer
);


/* =====================================================
   UTILITY
===================================================== */

function clamp(v,min,max){

  return Math.max(
    min,
    Math.min(max,v)
  );

}

function lerp(a,b,t){

  return a+(b-a)*t;

}


/* =====================================================
   BACKGROUND
===================================================== */

function drawBackground(){

  ctx.clearRect(
    0,0,W,H
  );

  const g =
    ctx.createRadialGradient(
      W*.5,
      H*.25,
      20,
      W*.5,
      H*.5,
      Math.max(W,H)
    );

  g.addColorStop(
    0,
    "rgba(255,255,255,.95)"
  );

  g.addColorStop(
    .55,
    "rgba(247,244,238,.82)"
  );

  g.addColorStop(
    1,
    "rgba(229,225,217,.55)"
  );

  ctx.fillStyle = g;

  ctx.fillRect(
    0,0,W,H
  );

}


/* =====================================================
   PIVOT
===================================================== */

function drawPivot(){

  const x = W/2;
  const y = 30;

  ctx.save();

  ctx.shadowColor =
    "rgba(0,0,0,.18)";

  ctx.shadowBlur = 9;
  ctx.shadowOffsetY = 3;

  const g =
    ctx.createRadialGradient(
      x-2,y-3,1,
      x,y,9
    );

  g.addColorStop(
    0,
    "#fff"
  );

  g.addColorStop(
    .45,
    "#d9d5ce"
  );

  g.addColorStop(
    1,
    "#8d8982"
  );

  ctx.fillStyle = g;

  ctx.beginPath();

  ctx.arc(
    x,y,6,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}


/* =====================================================
   ROPE
===================================================== */

function getRopePoints(){

  const pivotX = W/2;
  const pivotY = 30;

  const endX =
    pivotX+physics.x;

  const endY =
    pivotY+physics.y;

  const dx =
    physics.x;

  const dy =
    physics.y;

  const distance =
    Math.max(
      1,
      Math.hypot(dx,dy)
    );

  const stretch =
    Math.max(
      0,
      distance-state.restLength
    );

  const tension =
    clamp(
      stretch/physics.maxStretch,
      0,
      1
    );

  const nx =
    dx/distance;

  const ny =
    dy/distance;

  const px = -ny;
  const py = nx;

  const curve =
    clamp(
      physics.vx*.55,
      -35,
      35
    );

  const bend =
    curve*(1-tension);

  return {

    pivotX,
    pivotY,

    endX,
    endY,

    distance,

    tension,

    c1x:
      lerp(pivotX,endX,.33)+px*bend,

    c1y:
      lerp(pivotY,endY,.33)+py*bend,

    c2x:
      lerp(pivotX,endX,.72)+px*bend*.45,

    c2y:
      lerp(pivotY,endY,.72)+py*bend*.45

  };

}


function drawRope(){

  const r =
    getRopePoints();

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(
    r.pivotX+1.2,
    r.pivotY+2
  );

  ctx.bezierCurveTo(
    r.c1x+1.2,
    r.c1y+2,
    r.c2x+1.2,
    r.c2y+2,
    r.endX+1.2,
    r.endY+2
  );

  ctx.strokeStyle =
    "rgba(0,0,0,.13)";

  ctx.lineWidth = 4.2;
  ctx.lineCap = "round";
  ctx.stroke();


  const ropeGradient =
    ctx.createLinearGradient(
      r.pivotX,
      r.pivotY,
      r.endX,
      r.endY
    );

  ropeGradient.addColorStop(
    0,
    "#d7a93b"
  );

  ropeGradient.addColorStop(
    .25,
    "#f3d06b"
  );

  ropeGradient.addColorStop(
    .5,
    "#c18b20"
  );

  ropeGradient.addColorStop(
    .72,
    "#f0c95d"
  );

  ropeGradient.addColorStop(
    1,
    "#9b6a16"
  );

  ctx.beginPath();

  ctx.moveTo(
    r.pivotX,
    r.pivotY
  );

  ctx.bezierCurveTo(
    r.c1x,
    r.c1y,
    r.c2x,
    r.c2y,
    r.endX,
    r.endY
  );

  ctx.strokeStyle =
    ropeGradient;

  ctx.lineWidth =
    2.6+r.tension*1.3;

  ctx.stroke();

  ctx.restore();

}


/* =====================================================
   CONNECTOR
===================================================== */

function drawConnector(){

  const r =
    getRopePoints();

  ctx.save();

  const g =
    ctx.createLinearGradient(
      r.endX-8,
      r.endY-8,
      r.endX+8,
      r.endY+8
    );

  g.addColorStop(
    0,
    "#fff2a2"
  );

  g.addColorStop(
    .35,
    "#d8a634"
  );

  g.addColorStop(
    .7,
    "#9b6c18"
  );

  g.addColorStop(
    1,
    "#f4d16b"
  );

  ctx.strokeStyle = g;

  ctx.lineWidth = 3;

  ctx.beginPath();

function drawCharm(x,y,s,a){

    drawEvilEye(
      x,y,s,a
    );

  }
  else if(state.charm==="lemon"){

      x,y,s,a
    );

    );

/* =====================================================
   PHYSICS — FIXED
===================================================== */

function updatePhysics(){

  /* -----------------------------------------------
     DRAGGING
  ------------------------------------------------ */

  if(state.dragging){

    physics.x =
      clamp(
        state.pointerX-W/2,
        -W*.46,
        W*.46
      );

    physics.y =
      Math.max(
        35,
        state.pointerY-30
      );

    physics.angle =
      lerp(
        physics.angle,
        clamp(
          physics.vx*.018,
          -.34,
          .34
        ),
        .18
      );

    return;
  }


  /* -----------------------------------------------
     TARGET POSITION
     
     THIS IS THE MAIN X/Y SLIDER FIX.
  ------------------------------------------------ */

  const targetX =
    state.x;

  const targetY =
    state.restLength+
    state.y;


  /*
     Immediately after slider movement,
     don't let gravity move the charm.
  */

  if(
    performance.now() <
    state.positionLockUntil
  ){

    physics.x = targetX;
    physics.y = targetY;

    physics.vx = 0;
    physics.vy = 0;

    return;
  }


  /* -----------------------------------------------
     GRAVITY
  ------------------------------------------------ */

  physics.vy +=
    physics.gravity;


  /* -----------------------------------------------
     SPRING TOWARDS SLIDER TARGET
  ------------------------------------------------ */

  const targetDX =
    targetX-physics.x;

  const targetDY =
    targetY-physics.y;


  physics.vx +=
    targetDX*
    physics.targetSpring;

  physics.vy +=
    targetDY*
    physics.targetSpring;


  /* -----------------------------------------------
     MOVE
  ------------------------------------------------ */

  physics.x +=
    physics.vx;

  physics.y +=
    physics.vy;


  /* -----------------------------------------------
     ELASTIC ROPE
  ------------------------------------------------ */

  let dx =
    physics.x;

  let dy =
    physics.y;

  let distance =
    Math.max(
      1,
      Math.hypot(dx,dy)
    );


  const extension =
    distance-
    state.restLength;


  if(extension>0){

    const nx =
      dx/distance;

    const ny =
      dy/distance;

    const force =
      extension*
      physics.spring;


    physics.vx -=
      nx*force;

    physics.vy -=
      ny*force;

  }


  /* -----------------------------------------------
     MAXIMUM STRETCH
  ------------------------------------------------ */

  const maxDistance =
    state.restLength+
    physics.maxStretch;


  if(distance>maxDistance){

    const nx =
      dx/distance;

    const ny =
      dy/distance;


    physics.x =
      nx*maxDistance;

    physics.y =
      ny*maxDistance;


    const outward =
      physics.vx*nx+
      physics.vy*ny;


    if(outward>0){

      physics.vx -=
        nx*outward*.8;

      physics.vy -=
        ny*outward*.8;

    }

  }


  /* -----------------------------------------------
     DAMPING
  ------------------------------------------------ */

  physics.vx *=
    physics.damping;

  physics.vy *=
    physics.damping;


  /* -----------------------------------------------
     NATURAL ROTATION
  ------------------------------------------------ */

  const targetAngle =
    clamp(
      physics.vx*.018,
      -.32,
      .32
    );


  physics.angularVelocity +=
    (
      targetAngle-
      physics.angle
    )*.012;


  physics.angularVelocity *=
    physics.angularDamping;


  physics.angle +=
    physics.angularVelocity;


  physics.angle =
    clamp(
      physics.angle,
      -.42,
      .42
    );

}


/* =====================================================
   DRAW
===================================================== */

function drawScene(){

  drawBackground();

  drawPivot();

  drawRope();

  drawConnector();


  const r =
    getRopePoints();


  drawCharm(
    r.endX,
    r.endY,
    state.size,
    physics.angle
  );

}


/* =====================================================
   ANIMATION LOOP
===================================================== */

let lastTime =
  performance.now();


function animationLoop(now){

  const dt =
    Math.min(
      (now-lastTime)/16.6667,
      2
    );

  lastTime =
    now;


  const steps =
    Math.max(
      1,
      Math.min(
        3,
        Math.round(dt)
      )
    );


  for(
    let i=0;
    i<steps;
    i++
  ){

    updatePhysics();

  }


  drawScene();


  /*
     IMPORTANT:

     There are NO xRange.addEventListener()
     or yRange.addEventListener() calls here.

     This was the bug in your old code.
  */

  requestAnimationFrame(
    animationLoop
  );

}


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e=>{

    if(e.key==="Escape"){

      menu.classList.remove(
        "show"
      );

    }


    if(
      e.key.toLowerCase()==="r" &&
      !e.ctrlKey &&
      !e.metaKey
    ){

      resetPhysics();

    }

  }
);


/* =====================================================
   START
===================================================== */

resetPhysics();

updateControls();

requestAnimationFrame(
  animationLoop
);

/* =====================================================
   HANGING ASSEMBLY MASTER FIX
   X/Y = NAIL POSITION
   STRING LENGTH = ROPE LENGTH
===================================================== */

/* -----------------------------------------------------
   PIVOT / NAIL POSITION
----------------------------------------------------- */

function getPivotPosition(){

  return {
    x: W/2 + state.x,
    y: 30 + state.y
  };

}


function getCharmPosition(){

  const pivot =
    getPivotPosition();

  return {
    x: pivot.x + physics.x,
    y: pivot.y + physics.y
  };

}


/* -----------------------------------------------------
   RESET
----------------------------------------------------- */

function resetPhysics(){

  state.x = 0;

  state.y = 0;

  state.size =
    Number(sizeRange.value)/100;

  physics.x = 0;

  physics.y =
    state.restLength;

  physics.vx = 0;

  physics.vy = 0;

  physics.angle = 0;

  physics.angularVelocity = 0;

  xRange.value = 0;

  yRange.value = 0;

  updateControls();

}


/* -----------------------------------------------------
   CONTROL VALUES
----------------------------------------------------- */

/*
   IMPORTANT:

   X/Y ONLY MOVE THE NAIL.

   They DO NOT modify physics.x
   They DO NOT modify physics.y
   They DO NOT modify rope length.
*/


/*
   Replace the old slider elements with clones.

   This removes the old X/Y listeners that were
   fighting with the new system.
*/

const newXRange =
  xRange.cloneNode(true);

const newYRange =
  yRange.cloneNode(true);

const newLengthRange =
  lengthRange.cloneNode(true);

const newResetBtn =
  resetBtn.cloneNode(true);


xRange.parentNode.replaceChild(
  newXRange,
  xRange
);

yRange.parentNode.replaceChild(
  newYRange,
  yRange
);

lengthRange.parentNode.replaceChild(
  newLengthRange,
  lengthRange
);

resetBtn.parentNode.replaceChild(
  newResetBtn,
  resetBtn
);


/* X POSITION */

newXRange.addEventListener(
  "input",
  ()=>{

    state.x =
      Number(newXRange.value);

    updateControls();

  }
);


/* Y POSITION */

newYRange.addEventListener(
  "input",
  ()=>{

    state.y =
      Number(newYRange.value);

    updateControls();

  }
);


/* SIZE */

sizeRange.addEventListener(
  "input",
  ()=>{

    state.size =
      Number(sizeRange.value)/100;

    updateControls();

  }
);


/* STRING LENGTH */

newLengthRange.addEventListener(
  "input",
  ()=>{

    state.restLength =
      Number(newLengthRange.value);

    /*
       String length is the ONLY thing
       that changes the rope length.

       If the user isn't dragging,
       put the charm at the new rope end.
    */

    if(!state.dragging){

      physics.x = 0;

      physics.y =
        state.restLength;

      physics.vx = 0;

      physics.vy = 0;

      physics.angle = 0;

      physics.angularVelocity = 0;

    }

    updateControls();

  }
);


/* RESET BUTTON */

newResetBtn.addEventListener(
  "click",
  resetPhysics
);


/* -----------------------------------------------------
   CONTROL DISPLAY
----------------------------------------------------- */

function updateControls(){

  document.getElementById("xValue").textContent =
    Math.round(state.x);

  document.getElementById("yValue").textContent =
    Math.round(state.y);

  document.getElementById("sizeValue").textContent =
    Math.round(state.size*100)+"%";

  document.getElementById("lengthValue").textContent =
    Math.round(state.restLength);

}


/* -----------------------------------------------------
   CHARM HIT TEST
----------------------------------------------------- */

function isInsideCharm(px,py){

  const charm =
    getCharmPosition();

  const radius =
    78*state.size;

  const dx =
    px-charm.x;

  const dy =
    py-charm.y;

  return (
    dx*dx+
    dy*dy
  ) <= radius*radius;

}


/* -----------------------------------------------------
   POINTER POSITION
----------------------------------------------------- */

function getPointerPosition(e){

  const rect =
    canvas.getBoundingClientRect();

  return {

    x:e.clientX-rect.left,

    y:e.clientY-rect.top

  };

}


/* -----------------------------------------------------
   NEW DRAG SYSTEM
-----------------------------------------------------

   Capture phase is used here so the OLD pointer
   listeners cannot interfere with this new system.
----------------------------------------------------- */


/* DRAG START */

canvas.addEventListener(
  "pointerdown",
  e=>{

    const p =
      getPointerPosition(e);

    if(!isInsideCharm(p.x,p.y)){

      return;

    }

    const pivot =
      getPivotPosition();

    state.dragging = true;

    state.pointerId =
      e.pointerId;

    state.pointerX =
      p.x;

    state.pointerY =
      p.y;

    state.lastPointerX =
      p.x;

    state.lastPointerY =
      p.y;

    state.pointerVX = 0;

    state.pointerVY = 0;


    /*
       Convert the pointer position into
       coordinates relative to the nail.
    */

    physics.x =
      p.x-pivot.x;

    physics.y =
      Math.max(
        35,
        p.y-pivot.y
      );

    physics.vx = 0;

    physics.vy = 0;


    canvas.classList.add(
      "dragging"
    );

    try{

      canvas.setPointerCapture(
        e.pointerId
      );

    }catch(err){}

    e.preventDefault();

  },
  true
);


/* DRAG MOVE */

canvas.addEventListener(
  "pointermove",
  e=>{

    if(
      !state.dragging ||
      e.pointerId !== state.pointerId
    ){

      return;

    }

    const p =
      getPointerPosition(e);

    const dx =
      p.x-state.lastPointerX;

    const dy =
      p.y-state.lastPointerY;


    state.pointerVX = dx;

    state.pointerVY = dy;

    state.pointerX = p.x;

    state.pointerY = p.y;

    state.lastPointerX = p.x;

    state.lastPointerY = p.y;


    const pivot =
      getPivotPosition();


    /*
       IMPORTANT:

       Charm position is calculated relative
       to the nail.

       Therefore moving the nail with X/Y
       doesn't stretch the rope.
    */

    physics.x =
      clamp(
        p.x-pivot.x,
        -W*.46,
        W*.46
      );

    physics.y =
      Math.max(
        35,
        p.y-pivot.y
      );


    physics.vx = dx;

    physics.vy = dy;


    physics.angle =
      lerp(
        physics.angle,
        clamp(
          dx*.018,
          -.32,
          .32
        ),
        .2
      );


    e.preventDefault();

  },
  true
);


/* -----------------------------------------------------
   RELEASE
----------------------------------------------------- */

function releaseNewPointer(e){

  if(
    !state.dragging ||
    e.pointerId !== state.pointerId
  ){

    return;

  }


  state.dragging = false;


  /*
     Transfer the release velocity,
     but don't make it ridiculously powerful.
  */

  physics.vx =
    clamp(
      state.pointerVX*1.05,
      -18,
      18
    );

  physics.vy =
    clamp(
      state.pointerVY*1.05,
      -18,
      18
    );


  physics.angularVelocity =
    clamp(
      state.pointerVX*.008,
      -.08,
      .08
    );


  canvas.classList.remove(
    "dragging"
  );


  try{

    canvas.releasePointerCapture(
      e.pointerId
    );

  }catch(err){}


  e.preventDefault();

}


canvas.addEventListener(
  "pointerup",
  releaseNewPointer,
  true
);


canvas.addEventListener(
  "pointercancel",
  releaseNewPointer,
  true
);


/* -----------------------------------------------------
   PIVOT DRAW
----------------------------------------------------- */

function drawPivot(){

  const pivot =
    getPivotPosition();

  const x =
    pivot.x;

  const y =
    pivot.y;


  ctx.save();


  ctx.shadowColor =
    "rgba(0,0,0,.18)";

  ctx.shadowBlur = 9;

  ctx.shadowOffsetY = 3;


  const g =
    ctx.createRadialGradient(
      x-2,
      y-3,
      1,
      x,
      y,
      9
    );


  g.addColorStop(
    0,
    "#fff"
  );

  g.addColorStop(
    .45,
    "#d9d5ce"
  );

  g.addColorStop(
    1,
    "#8d8982"
  );


  ctx.fillStyle = g;


  ctx.beginPath();

  ctx.arc(
    x,
    y,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.restore();

}


/* -----------------------------------------------------
   ROPE POINTS
----------------------------------------------------- */

function getRopePoints(){

  const pivot =
    getPivotPosition();


  const pivotX =
    pivot.x;

  const pivotY =
    pivot.y;


  const endX =
    pivotX+physics.x;

  const endY =
    pivotY+physics.y;


  const dx =
    physics.x;

  const dy =
    physics.y;


  const distance =
    Math.max(
      1,
      Math.hypot(dx,dy)
    );


  const stretch =
    Math.max(
      0,
      distance-state.restLength
    );


  const tension =
    clamp(
      stretch/physics.maxStretch,
      0,
      1
    );


  const nx =
    dx/distance;

  const ny =
    dy/distance;


  const px =
    -ny;

  const py =
    nx;


  /*
     Small natural rope bend.

     It is based on LOCAL velocity,
     not the nail position.
  */

  const curve =
    clamp(
      physics.vx*.55,
      -35,
      35
    );


  const bend =
    curve*(1-tension);


  return {

    pivotX,

    pivotY,

    endX,

    endY,

    distance,

    tension,


    c1x:
      lerp(
        pivotX,
        endX,
        .33
      )+
      px*bend,


    c1y:
      lerp(
        pivotY,
        endY,
        .33
      )+
      py*bend,


    c2x:
      lerp(
        pivotX,
        endX,
        .72
      )+
      px*bend*.45,


    c2y:
      lerp(
        pivotY,
        endY,
        .72
      )+
      py*bend*.45

  };

}


/* -----------------------------------------------------
   PHYSICS
----------------------------------------------------- */

function updatePhysics(){

  /* ================================================
     DRAGGING
  ================================================ */

  if(state.dragging){

    const pivot =
      getPivotPosition();


    physics.x =
      clamp(
        state.pointerX-pivot.x,
        -W*.46,
        W*.46
      );


    physics.y =
      Math.max(
        35,
        state.pointerY-pivot.y
      );


    physics.angle =
      lerp(
        physics.angle,
        clamp(
          physics.vx*.018,
          -.32,
          .32
        ),
        .2
      );


    return;

  }


  /* ================================================
     GRAVITY
  ================================================ */

  physics.vy +=
    physics.gravity;


  /* ================================================
     ROPE SPRING
  ================================================ */

  let dx =
    physics.x;

  let dy =
    physics.y;


  let distance =
    Math.max(
      1,
      Math.hypot(dx,dy)
    );


  const extension =
    distance-
    state.restLength;


  if(extension>0){

    const nx =
      dx/distance;

    const ny =
      dy/distance;


    const force =
      extension*
      physics.spring;


    physics.vx -=
      nx*force;

    physics.vy -=
      ny*force;

  }


  /* ================================================
     MAX STRETCH
  ================================================ */

  const maxDistance =
    state.restLength+
    physics.maxStretch;


  if(distance>maxDistance){

    const nx =
      dx/distance;

    const ny =
      dy/distance;


    physics.x =
      nx*maxDistance;

    physics.y =
      ny*maxDistance;


    const outward =
      physics.vx*nx+
      physics.vy*ny;


    if(outward>0){

      physics.vx -=
        nx*outward*.8;

      physics.vy -=
        ny*outward*.8;

    }

  }


  /* ================================================
     DAMPING
  ================================================ */

  physics.vx *=
    physics.damping;

  physics.vy *=
    physics.damping;


  /* ================================================
     MOVE
  ================================================ */

  physics.x +=
    physics.vx;

  physics.y +=
    physics.vy;


  /* ================================================
     KEEP ROPE FROM GOING ABOVE THE NAIL
  ================================================ */

  if(physics.y<35){

    physics.y = 35;

    if(physics.vy<0){

      physics.vy *= -.25;

    }

  }


  /* ================================================
     NATURAL SMALL ROTATION
  ================================================ */

  const targetAngle =
    clamp(
      physics.vx*.018,
      -.28,
      .28
    );


  physics.angularVelocity +=
    (
      targetAngle-
      physics.angle
    )*.012;


  physics.angularVelocity *=
    physics.angularDamping;


  physics.angle +=
    physics.angularVelocity;


  physics.angle =
    clamp(
      physics.angle,
      -.38,
      .38
    );

}


/* -----------------------------------------------------
   DRAW SCENE
----------------------------------------------------- */

function drawScene(){

  drawBackground();

  drawPivot();

  drawRope();

  drawConnector();


  const r =
    getRopePoints();


  drawCharm(
    r.endX,
    r.endY,
    state.size,
    physics.angle
  );

}


/* -----------------------------------------------------
   INITIAL VALUES
----------------------------------------------------- */

state.x = 0;

state.y = 0;

physics.x = 0;

physics.y =
  state.restLength;

physics.vx = 0;

physics.vy = 0;

physics.angle = 0;

physics.angularVelocity = 0;


/* Update visible slider values */

newXRange.value =
  state.x;

newYRange.value =
  state.y;

newLengthRange.value =
  state.restLength;


updateControls();


/* =====================================================
   END MASTER FIX
===================================================== */
</script>
